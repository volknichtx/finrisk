[project]
name = "finrisk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "volknichtx", email = "volkening.maurice@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "yfinance>=1.7.0",
]

[project.scripts]
finrisk = "finrisk:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
